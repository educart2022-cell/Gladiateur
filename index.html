[1:12 PM, 26/08/2026] Atef: <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR - Modèle 3D Animé</title>
    <!-- Import du composant model-viewer -->
    <script type="importmap">
        {
            "imports": {
                "@google/model-viewer": "https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #111;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #1a1a1a;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background: transparent;
        }
        /* Contrôles audio en overlay */
        #audio-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            z-index: 10;
            flex-wrap: wrap;
        }
        .audio-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 140px;
            justify-content: center;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .audio-btn:active { transform: scale(0.95); }
        .audio-btn.playing {
            background: rgba(255, 215, 0, 0.25);
            border-color: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
        }
        .audio-btn .icon { font-size: 20px; }
        .audio-btn .label { font-size: 13px; opacity: 0.9; }
        #status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 13px;
            color: #aaa;
            z-index: 10;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
            white-space: nowrap;
        }
        #ar-prompt {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 150, 255, 0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            color: #8ab4f8;
            z-index: 10;
            border: 1px solid rgba(0, 150, 255, 0.3);
            text-align: center;
            pointer-events: none;
        }
        @media (max-width: 600px) {
            .audio-btn { padding: 10px 18px; font-size: 14px; min-width: 110px; }
            #status { font-size: 11px; padding: 5px 14px; white-space: normal; }
            #ar-prompt { font-size: 12px; padding: 6px 16px; bottom: 110px; }
        }
        /* Cache le bouton AR par défaut pour le personnaliser */
        model-viewer::part(default-ar-button) { display: none; }
        #custom-ar-btn {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a73e8;
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 8px 30px rgba(26, 115, 232, 0.4);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            display: none; /* affiché dynamiquement si AR dispo */
        }
        #custom-ar-btn:active { transform: scale(0.95); }
        #custom-ar-btn.show { display: block; }
    </style>
</head>
<body>

<div id="container">
    <!-- Statut -->
    <div id="status">🔍 Chargement du modèle 3D...</div>

    <!-- Lecteur 3D avec AR -->
    <model-viewer
        id="mv"
        src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/RiggedSimple/RiggedSimple.glb"
        alt="Modèle 3D animé"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        autoplay
        shadow-intensity="0.6"
        environment-image="neutral"
        exposure="1.0"
        style="width:100%; height:100%;"
        loading="eager"
        reveal="auto"
    >
    </model-viewer>

    <!-- Bouton AR personnalisé -->
    <button id="custom-ar-btn">📱 Voir en Réalité Augmentée</button>

    <!-- Invite AR -->
    <div id="ar-prompt">👆 Placez l'objet sur une surface plane</div>

    <!-- Contrôles audio -->
    <div id="audio-controls">
        <button class="audio-btn" id="track1" data-track="0">
            <span class="icon">🎵</span>
            <span class="label">Musique 1</span>
        </button>
        <button class="audio-btn" id="track2" data-track="1">
            <span class="icon">🎶</span>
            <span class="label">Musique 2</span>
        </button>
        <button class="audio-btn" id="stop-btn">
            <span class="icon">⏹️</span>
            <span class="label">Stop</span>
        </button>
    </div>
</div>

<script type="module">
    // ---- Initialisation ----
    import "@google/model-viewer";

    const modelViewer = document.getElementById('mv');
    const statusEl = document.getElementById('status');
    const arPrompt = document.getElementById('ar-prompt');
    const customArBtn = document.getElementById('custom-ar-btn');

    // ---- Gestion audio ----
    // Deux pistes libres de droit (Kevin MacLeod)
    const tracks = [
        'https://upload.wikimedia.org/wikipedia/commons/transcoded/e/e4/Kevin_MacLeod_-_Wallpaper.ogg/Kevin_MacLeod_-_Wallpaper.ogg.mp3',
        'https://upload.wikimedia.org/wikipedia/commons/transcoded/8/8e/Kevin_MacLeod_-_Winter_Wonderland.ogg/Kevin_MacLeod_-_Winter_Wonderland.ogg.mp3'
    ];
    const trackNames = ['Musique 1', 'Musique 2'];

    let currentAudio = null;
    let currentTrackIndex = -1;

    function createAudio(src) {
        const audio = new Audio(src);
        audio.loop = true;
        audio.volume = 0.6;
        return audio;
    }

    function playTrack(index) {
        stopAudio();
        if (index < 0 || index >= tracks.length) return;
        const audio = createAudio(tracks[index]);
        audio.play().catch(e => console.warn('Lecture audio bloquée:', e));
        currentAudio = audio;
        currentTrackIndex = index;
        updateButtons(index);
        statusEl.textContent = ▶️ ${trackNames[index]} en cours;
    }

    function stopAudio() {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
            currentAudio = null;
        }
        currentTrackIndex = -1;
        updateButtons(-1);
        statusEl.textContent = '⏸️ Audio arrêté';
    }

    function updateButtons(activeIndex) {
        document.querySelectorAll('.audio-btn').forEach(btn => {
            btn.classList.remove('playing');
            const idx = parseInt(btn.dataset.track);
            if (!isNaN(idx) && idx === activeIndex) {
                btn.classList.add('playing');
            }
        });
    }

    // Événements des boutons audio
    document.getElementById('track1').addEventListener('click', () => playTrack(0));
    document.getElementById('track2').addEventListener('click', () => playTrack(1));
    document.getElementById('stop-btn').addEventListener('click', stopAudio);

    // ---- Gestion du modèle 3D ----
    modelViewer.addEventListener('load', () => {
        statusEl.textContent = '✅ Modèle chargé – Appuyez sur "Voir en AR"';
        // Vérifier la disponibilité AR
        checkARSupport();
    });

    modelViewer.addEventListener('error', (e) => {
        statusEl.textContent = '❌ Erreur chargement modèle';
        console.error('Erreur model-viewer:', e);
    });

    // ---- Détection AR et affichage du bouton ----
    async function checkARSupport() {
        try {
            // Vérifie si WebXR est supporté
            if (navigator.xr) {
                const isSupported = await navigator.xr.isSessionSupported('immersive-ar');
                if (isSupported) {
                    customArBtn.classList.add('show');
                    statusEl.textContent = '✅ AR disponible – Appuyez sur le bouton';
                    return;
                }
            }
            // Fallback : Scene Viewer / Quick Look via model-viewer
            // On teste en simulant un clic sur le bouton AR natif
            const arButton = modelViewer.shadowRoot?.querySelector('.ar-button');
            if (arButton && !arButton.hasAttribute('hidden')) {
                customArBtn.classList.add('show');
                statusEl.textContent = '✅ AR disponible (Scene Viewer/Quick Look)';
                return;
            }
            // Si on arrive ici, l'AR n'est pas détectée
            statusEl.textContent = '⚠️ AR non disponible sur ce navigateur';
            arPrompt.textContent = '⚠️ La RA n\'est pas supportée par ce navigateur';
        } catch (e) {
            console.warn('Erreur détection AR:', e);
            statusEl.textContent = '⚠️ AR non disponible';
        }
    }

    // ---- Action du bouton AR personnalisé ----
    customArBtn.addEventListener('click', async () => {
        try {
            // Tente d'activer WebXR d'abord
            if (navigator.xr) {
                const supported = await navigator.xr.isSessionSupported('immersive-ar');
                if (supported) {
                    modelViewer.activateAR();
                    return;
                }
            }
            // Fallback : tente de cliquer sur le bouton AR natif
            const arButton = modelViewer.shadowRoot?.querySelector('.ar-button');
            if (arButton) {
                arButton.click();
            } else {
                // Dernier recours : l'attribut 'ar' devrait déclencher l'UI
                modelViewer.activateAR();
            }
        } catch (e) {
            console.error('Erreur activation AR:', e);
            statusEl.textContent = '❌ Erreur: ' + e.message;
        }
    });

    // ---- Gestion du redimensionnement ----
    window.addEventListener('resize', () => {
        // Rien de spécial, model-viewer gère
    });

    // ---- Nettoyage audio si la page est cachée ----
    document.addEventListener('visibilitychange', () => {
        if (document.hidden && currentAudio) {
            currentAudio.pause();
        } else if (!document.hidden && currentAudio && currentTrackIndex >= 0) {
            currentAudio.play().catch(() => {});
        }
    });

    console.log('✅ WebAR prêt - Modèle 3D animé + 2 pistes audio');
</script>

</body>
</html>
